<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackjack 6:5 · Poor Penetration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Internal Blackjack Simulator</p>
      <h1>Blackjack 6:5 · Poor Penetration</h1>
      <p class="subtitle">6 deck regular shoe, visible discard tray, computer players, splits, insurance, and dealer hits soft 17.</p>
    </div>
    <div class="table-switch" id="tableSwitch"></div>
  </header>

  <main class="layout">
    <section class="panel rules">
      <h2>Table Rules</h2>
      <div id="rulesList"></div>
      <div class="controls">
        <label>Bet <input id="betInput" type="number" min="5" step="5" value="25"></label>
        <label>Computer seats <select id="seatSelect"><option>4</option><option selected>5</option><option>6</option></select></label>
        <button id="newShoeBtn">New shoe</button>
        <button id="resetBankrollBtn">Reset bankroll to $1000</button>
        <button id="dealBtn" class="primary">Deal hand</button>
      </div>
    </section>

    <section class="panel shoe">
      <h2>Shoe and Discard Tray</h2>
      <div class="shoe-meter"><div id="shoeFill"></div></div>
      <div class="shoe-stats" id="shoeStats"></div>
      <h3>Recent discards</h3>
      <div id="discardTray" class="discard-tray"></div>
    </section>

    <section class="table panel">
      <div class="dealer-area">
        <h2>Dealer</h2>
        <div id="dealerCards" class="cards"></div>
        <div id="dealerScore" class="score"></div>
      </div>
      <div id="playersArea" class="players"></div>
      <div class="action-bar" id="actionBar">
        <button id="hitBtn">Hit</button>
        <button id="standBtn">Stand</button>
        <button id="doubleBtn">Double</button>
        <button id="splitBtn">Split</button>
        <button id="insuranceBtn">Insurance Yes</button>
        <button id="noInsuranceBtn">Insurance No</button>
      </div>
      <div id="messageLog" class="log"></div>
    </section>
  </main>


  <div id="confirmOverlay" class="confirm-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-box">
      <h2 id="confirmTitle">Please confirm</h2>
      <p id="confirmMessage"></p>
      <div class="confirm-actions">
        <button id="confirmCancelBtn" type="button" class="secondary">Cancel</button>
        <button id="confirmOkBtn" type="button" class="danger">Yes, continue</button>
      </div>
    </div>
  </div>
  <script src="config.js?v=modal-confirm-2"></script>
  <script src="game.js?v=modal-confirm-2"></script>
</body>
</html>
